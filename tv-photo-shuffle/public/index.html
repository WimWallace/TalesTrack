<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TV Photo Shuffle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; }
  #start h1 { margin: 0; font-weight: 600; font-size: 24px; }
  #start input, #start select { width: 100%; max-width: 520px; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #111; color: #eee; box-sizing: border-box; }
  #start label { display: flex; align-items: center; gap: 12px; font-size: 16px; }
  #start label select { width: auto; }
  button { padding: 14px 24px; font-size: 18px; border-radius: 10px; border: 0; background: #2d6cdf; color: #fff; cursor: pointer; }
  button.secondary { background: #333; }
  button:focus { outline: 3px solid #fff; }
  #msg { min-height: 1.4em; color: #aaa; text-align: center; max-width: 520px; }

  #show { position: fixed; inset: 0; display: none; cursor: none; }
  #show img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.8s ease; }
  #show img.on { opacity: 1; }
  #controls { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: rgba(0,0,0,0.5); cursor: default; }
  #controls.on { display: flex; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; }
  #speed { font-size: 18px; min-width: 9em; text-align: center; }
  #status { color: #ccc; font-size: 14px; text-align: center; padding: 0 16px; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; text-align: center; padding: 16px; }
  #pausedTag { position: absolute; top: 16px; right: 16px; padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,0.6); color: #ddd; font-size: 14px; display: none; }
</style>
</head>
<body>

<div id="start">
  <h1>TV Photo Shuffle</h1>
  <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="Link naar gedeeld Google Foto's-album">
  <label>Tijd per foto <select id="secs"></select></label>
  <button id="go" autofocus>Start</button>
  <div id="msg"></div>
</div>

<div id="show">
  <img id="a" alt="" referrerpolicy="no-referrer">
  <img id="b" alt="" referrerpolicy="no-referrer">
  <div id="loading">Album laden…</div>
  <div id="pausedTag">Gepauzeerd</div>
  <div id="controls">
    <div class="row">
      <button id="prev" class="secondary">◀ Vorige</button>
      <button id="pause">Pauze</button>
      <button id="resume">Hervat</button>
      <button id="nextBtn" class="secondary">Volgende ▶</button>
    </div>
    <div class="row">
      <button id="less" class="secondary">−</button>
      <div id="speed"></div>
      <button id="more" class="secondary">+</button>
    </div>
    <div class="row"><button id="exit" class="secondary">Stoppen</button></div>
    <div id="status"></div>
  </div>
</div>

<script>
const DEFAULT_ALBUM = 'https://photos.app.goo.gl/nnNufxC1nMz7krmn7';
const STEPS = [3, 4, 5, 6, 7, 8, 10, 12, 15, 20, 30, 60];
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
};

let run = null; // state of the current slideshow; replaced on every start
let secs = +store.get('secs') || 5;
if (!STEPS.includes(secs)) secs = 5;

$('url').value = store.get('album') || DEFAULT_ALBUM;
for (const s of STEPS) $('secs').add(new Option(s + ' seconden', s, false, s === secs));
$('secs').addEventListener('change', () => setSecs(+$('secs').value));

function setSecs(s) {
  secs = s;
  store.set('secs', s);
  $('secs').value = s;
  $('speed').textContent = `${s} seconden per foto`;
  if (run && !run.paused && run.shownAt) { // apply right away, counted from when the current photo appeared
    clearTimeout(run.timer);
    run.timer = setTimeout(() => next(run), Math.max(0, run.shownAt + s * 1000 - Date.now()));
  }
}
function stepSecs(d) { setSecs(STEPS[Math.max(0, Math.min(STEPS.length - 1, STEPS.indexOf(secs) + d))]); showControls(); }

function randInt(n) { // uniform 0..n-1
  const buf = new Uint32Array(1);
  const limit = Math.floor(0x100000000 / n) * n;
  do crypto.getRandomValues(buf); while (buf[0] >= limit);
  return buf[0] % n;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = randInt(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

// Request size: big enough for the screen (or a 4K TV), never upscaled by Google.
const box = Math.min(3840, Math.round(Math.max(screen.width, screen.height) * (window.devicePixelRatio || 1)));
const sized = (u) => u.replace(/=[^/]*$/, '') + `=w${box}-h${box}`;

// ---- Rotation ----------------------------------------------------------------
// Browsers that ignore the EXIF orientation tag (many TV browsers) show portrait
// photos on their side. There we ask /api/orient for the tag and rotate ourselves.
const forceOrient = /[?&]orient=1/.test(location.search);
const nativeExif = !forceOrient && window.CSS && CSS.supports && CSS.supports('image-orientation', 'from-image');
const orientCache = new Map();
function orientation(url) {
  if (nativeExif) return Promise.resolve(null);
  if (!orientCache.has(url)) {
    orientCache.set(url, fetch('/api/orient?u=' + encodeURIComponent(url)).then((r) => r.json()).catch(() => null));
  }
  return orientCache.get(url);
}
const TRANSFORMS = { 2: 'scaleX(-1)', 3: 'rotate(180deg)', 4: 'scaleY(-1)', 5: 'rotate(90deg) scaleY(-1)', 6: 'rotate(90deg)', 7: 'rotate(90deg) scaleX(-1)', 8: 'rotate(270deg)' };
function rotationFor(info, img) {
  if (!info || !TRANSFORMS[info.o]) return 0;
  if (info.o >= 5 && info.w && info.h && img.naturalWidth !== img.naturalHeight) {
    // Only rotate if the browser really shows the stored (unrotated) pixels.
    if ((img.naturalWidth > img.naturalHeight) !== (info.w > info.h)) return 0;
  }
  return info.o;
}
function place(el) {
  const o = +el.dataset.o || 0;
  const W = innerWidth, H = innerHeight, s = el.style;
  if (o >= 5) { // rotated by 90°: lay out in a box with swapped sides, then turn it
    s.width = H + 'px'; s.height = W + 'px';
    s.left = (W - H) / 2 + 'px'; s.top = (H - W) / 2 + 'px';
  } else {
    s.width = s.height = '100%'; s.left = s.top = '0';
  }
  s.transform = TRANSFORMS[o] || '';
}
addEventListener('resize', () => { place($('a')); place($('b')); });

// ---- Album list --------------------------------------------------------------
// The full list is remembered, so the next start can shuffle the whole album at
// once; the list is refreshed in the background on every start.
function readCache(url) {
  try {
    const c = JSON.parse(store.get('albumCache') || 'null');
    return c && c.url === url && Array.isArray(c.items) ? c.items.map(([u, w, h]) => ({ u, w, h })) : null;
  } catch { return null; }
}
function writeCache(url, items) {
  store.set('albumCache', JSON.stringify({ url, items: items.map((it) => [it.u, it.w, it.h]) }));
}

// New photos go to a random position in the part of the queue not shown yet,
// which keeps the order a uniform shuffle of the whole album.
function addItems(r, items) {
  for (const it of items) {
    if (r.seen.has(it.u)) continue;
    r.seen.add(it.u);
    r.all.push(it);
    const from = Math.min(r.pos, r.queue.length);
    r.queue.splice(from + randInt(r.queue.length - from + 1), 0, it);
  }
}
function removeMissing(r, fresh) {
  const keep = new Set(fresh.map((it) => it.u));
  r.all = r.all.filter((it) => keep.has(it.u));
  r.queue = r.queue.slice(0, r.pos).concat(r.queue.slice(r.pos).filter((it) => keep.has(it.u)));
  for (const u of [...r.seen]) if (!keep.has(u)) r.seen.delete(u);
}

async function api(params) {
  for (let attempt = 0; ; attempt++) {
    try {
      const res = await fetch('/api/album?' + new URLSearchParams(params));
      const body = await res.json();
      if (!res.ok || body.error) throw new Error(body.error || 'HTTP ' + res.status);
      return body;
    } catch (e) {
      if (attempt >= 2) throw e;
      await new Promise((ok) => setTimeout(ok, 1500 * (attempt + 1)));
    }
  }
}

async function load(r, url) {
  const cached = readCache(url);
  if (cached && cached.length) { addItems(r, cached); r.fromCache = true; next(r); }

  const fresh = [];
  try {
    let page = await api({ url });
    const { id, key } = page;
    fresh.push(...page.items);
    while (page.token && r === run) {
      if (!r.started) $('loading').textContent = `Album laden… ${fresh.length} foto's`;
      page = await api({ id, key, token: page.token });
      fresh.push(...page.items);
    }
  } catch (e) {
    r.error = e.message;
  }
  if (r !== run) return;

  if (!r.error && fresh.length) { writeCache(url, fresh); if (r.fromCache) removeMissing(r, fresh); }
  addItems(r, fresh);
  r.loading = false;
  if (!r.all.length) { stop(); $('msg').textContent = 'Kon album niet laden: ' + (r.error || 'geen foto\'s gevonden'); return; }
  if (!r.started) next(r);
  updateStatus();
}

// ---- Slideshow ---------------------------------------------------------------
$('go').addEventListener('click', start);

async function start() {
  const url = $('url').value.trim();
  if (!url) return;
  store.set('album', url);

  // These need the click that started the slideshow.
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch {}
  try { await screen.orientation.lock('landscape'); } catch {}

  run = { all: [], seen: new Set(), queue: [], pos: 0, timer: null, paused: false, loading: true, started: false, front: $('a'), back: $('b'), hideTimer: null, seq: 0 };
  $('start').style.display = 'none';
  $('show').style.display = 'block';
  $('loading').style.display = 'flex';
  $('loading').textContent = 'Album laden…';
  $('pausedTag').style.display = 'none';
  $('a').classList.remove('on'); $('b').classList.remove('on');
  hideControls();
  setSecs(secs);
  keepAwake();
  load(run, url);
}

// Show queue[pos] and advance. Also used for the manual Previous/Next buttons.
function next(r) {
  if (r !== run || !r.queue.length) return;
  r.started = true;
  clearTimeout(r.timer);
  if (r.pos >= r.queue.length) { // whole album shown: new random order
    const last = r.queue[r.queue.length - 1];
    r.queue = shuffle(r.all.slice());
    if (r.queue.length > 1 && r.queue[0] === last) r.queue.push(r.queue.shift());
    r.pos = 0;
  }
  const item = r.queue[r.pos++];
  const seq = ++r.seq;
  const src = sized(item.u);
  const img = new Image();
  img.referrerPolicy = 'no-referrer';
  const loaded = new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; });
  img.src = src;
  Promise.all([loaded, orientation(src)]).then(([, info]) => {
    if (r !== run || seq !== r.seq) return;
    const el = r.back;
    el.dataset.o = rotationFor(info, img);
    place(el);
    el.src = src;
    el.classList.add('on');
    r.front.classList.remove('on');
    [r.front, r.back] = [r.back, r.front];
    $('loading').style.display = 'none';
    r.shownAt = Date.now();
    updateStatus();
    if (!r.paused) r.timer = setTimeout(() => next(r), secs * 1000);
  }, () => {
    if (r === run && seq === r.seq) r.timer = setTimeout(() => next(r), 300); // broken photo: skip
  });
}
function prev(r) {
  if (!r || r.pos < 2) return;
  r.pos -= 2;
  next(r);
}

function setPaused(p) {
  if (!run) return;
  run.paused = p;
  clearTimeout(run.timer);
  $('pausedTag').style.display = p ? 'block' : 'none';
  if (p) showControls();
  else { hideControls(); run.shownAt = Date.now(); run.timer = setTimeout(() => next(run), secs * 1000); }
}

function updateStatus() {
  const r = run;
  if (!r) return;
  let s = `Foto ${Math.min(r.pos, r.queue.length)} van ${r.all.length}`;
  if (r.loading) s += ' (album wordt bijgewerkt…)';
  if (r.error) s += ` — laden mislukt: ${r.error}`;
  $('status').textContent = s;
  $('pause').style.display = r.paused ? 'none' : '';
  $('resume').style.display = r.paused ? '' : 'none';
}

// While paused the controls stay on screen; while playing they hide after 6 s.
function showControls() {
  if (!run) return;
  updateStatus();
  $('controls').classList.add('on');
  clearTimeout(run.hideTimer);
  if (!run.paused) run.hideTimer = setTimeout(hideControls, 6000);
  const focus = run.paused ? $('resume') : $('pause');
  if (!$('controls').contains(document.activeElement) || getComputedStyle(document.activeElement).display === 'none') focus.focus();
}
function hideControls() { $('controls').classList.remove('on'); if (document.activeElement) document.activeElement.blur(); }

$('show').addEventListener('click', (e) => {
  if (!run || e.target.tagName === 'BUTTON') return;
  if ($('controls').classList.contains('on') && !run.paused) hideControls();
  else showControls();
});
$('pause').addEventListener('click', () => setPaused(true));
$('resume').addEventListener('click', () => setPaused(false));
$('prev').addEventListener('click', () => { prev(run); showControls(); });
$('nextBtn').addEventListener('click', () => { next(run); showControls(); });
$('less').addEventListener('click', () => stepSecs(-1));
$('more').addEventListener('click', () => stepSecs(1));
$('exit').addEventListener('click', () => { stop(); try { document.exitFullscreen(); } catch {} });

// Remote control / keyboard: OK shows the controls, play/pause keys, left/right to browse.
document.addEventListener('keydown', (e) => {
  if (!run) return;
  const k = e.key, open = $('controls').classList.contains('on');
  if (k === 'MediaPlayPause' || k === ' ' || e.keyCode === 10252) { setPaused(!run.paused); e.preventDefault(); }
  else if (k === 'MediaPause' || e.keyCode === 19) setPaused(true);
  else if (k === 'MediaPlay' || e.keyCode === 415) setPaused(false);
  else if (k === 'MediaStop' || e.keyCode === 413) $('exit').click();
  else if (!open && (k === 'ArrowRight' || k === 'MediaTrackNext')) { next(run); e.preventDefault(); }
  else if (!open && (k === 'ArrowLeft' || k === 'MediaTrackPrevious')) { prev(run); e.preventDefault(); }
  else if (!open && (k === 'Enter' || k === 'ArrowUp' || k === 'ArrowDown')) { showControls(); e.preventDefault(); }
  else if (open && (k === 'Escape' || k === 'Backspace' || e.keyCode === 10009) && !run.paused) { hideControls(); e.preventDefault(); }
  else if (open) { clearTimeout(run.hideTimer); if (!run.paused) run.hideTimer = setTimeout(hideControls, 6000); }
});

function stop() {
  if (run) { clearTimeout(run.timer); clearTimeout(run.hideTimer); }
  run = null;
  releaseAwake();
  $('show').style.display = 'none';
  $('start').style.display = 'flex';
  $('msg').textContent = '';
}

// Keep the screen on while the slideshow runs (the lock is dropped when the tab is hidden, so re-acquire it).
let wakeLock = null;
async function keepAwake() {
  try { if (run && 'wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && run) keepAwake(); });
</script>
</body>
</html>
